<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Il mio menu</title>
<meta name="theme-color" content="#E9F1EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1411" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Menu">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="Menu settimanale con quantità e consigli">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  --bg:#E9F1EC;
  --o1:#FFC9A3; --o2:#9BD9FF; --o3:#A8E6C3; --o4:#D3BFFF;
  --ink:#12281F; --ink2:#48604F;
  --accent:#1F7A5A; --accent-ink:#ffffff;
  --glass-a:rgba(255,255,255,.62); --glass-b:rgba(255,255,255,.34);
  --edge:rgba(255,255,255,.75); --hi:rgba(255,255,255,.9); --lo:rgba(20,60,40,.08);
  --shadow:rgba(30,70,50,.14); --divider:rgba(18,40,31,.10);
  --sel:rgba(255,255,255,.95); --sheen:.55;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1411;
    --o1:#7A3E1E; --o2:#1D4E7A; --o3:#1B6B4C; --o4:#4B3A8C;
    --ink:#EAF4EE; --ink2:#A6BDB0;
    --accent:#5FD3A4; --accent-ink:#06221A;
    --glass-a:rgba(255,255,255,.13); --glass-b:rgba(255,255,255,.05);
    --edge:rgba(255,255,255,.22); --hi:rgba(255,255,255,.35); --lo:rgba(0,0,0,.35);
    --shadow:rgba(0,0,0,.45); --divider:rgba(255,255,255,.12);
    --sel:rgba(255,255,255,.22); --sheen:.16;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1411;
  --o1:#7A3E1E; --o2:#1D4E7A; --o3:#1B6B4C; --o4:#4B3A8C;
  --ink:#EAF4EE; --ink2:#A6BDB0;
  --accent:#5FD3A4; --accent-ink:#06221A;
  --glass-a:rgba(255,255,255,.13); --glass-b:rgba(255,255,255,.05);
  --edge:rgba(255,255,255,.22); --hi:rgba(255,255,255,.35); --lo:rgba(0,0,0,.35);
  --shadow:rgba(0,0,0,.45); --divider:rgba(255,255,255,.12);
  --sel:rgba(255,255,255,.22); --sheen:.16;
  color-scheme:dark;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{background:var(--bg)}
body{
  margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
  font-family:"SF Pro Rounded",ui-rounded,"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16px; line-height:1.4; -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* ---------- Sfondo ---------- */
.blob{position:fixed;border-radius:50%;filter:blur(70px);opacity:.9;z-index:-1;pointer-events:none;will-change:transform}
.b1{width:70vmax;height:70vmax;left:-25vmax;top:-25vmax;background:var(--o1);animation:drift1 46s ease-in-out infinite alternate}
.b2{width:60vmax;height:60vmax;right:-22vmax;top:8vh;background:var(--o2);animation:drift2 52s ease-in-out infinite alternate}
.b3{width:65vmax;height:65vmax;left:-20vmax;bottom:-28vmax;background:var(--o3);animation:drift2 58s ease-in-out infinite alternate-reverse}
.b4{width:50vmax;height:50vmax;right:-15vmax;bottom:-20vmax;background:var(--o4);animation:drift1 48s ease-in-out infinite alternate-reverse}
@keyframes drift1{to{transform:translate(8vmax,6vmax) scale(1.08)}}
@keyframes drift2{to{transform:translate(-7vmax,-5vmax) scale(1.06)}}

/* ---------- Vetro ---------- */
.glass{
  position:relative; isolation:isolate; border-radius:28px;
  background:linear-gradient(140deg,var(--glass-a),var(--glass-b));
  -webkit-backdrop-filter:blur(26px) saturate(180%);
  backdrop-filter:blur(26px) saturate(180%);
  border:1px solid var(--edge);
  box-shadow:inset 0 1px 0 var(--hi), inset 0 -1px 0 var(--lo), 0 12px 32px var(--shadow);
}
.glass::before{
  content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none; z-index:-1;
  background:linear-gradient(160deg,rgba(255,255,255,.7) 0%,rgba(255,255,255,0) 34%);
  opacity:var(--sheen);
}

/* ---------- Struttura ---------- */
.wrap{max-width:680px;margin:0 auto;padding:calc(22px + env(safe-area-inset-top)) 16px calc(120px + env(safe-area-inset-bottom))}
header.top{padding:4px 6px 16px}
h1{margin:0;font-size:clamp(30px,8vw,40px);font-weight:800;letter-spacing:-.02em;line-height:1.05}
.sub{margin:6px 0 0;color:var(--ink2);font-size:15px}

/* ---------- Selettore giorni ---------- */
.days{
  position:sticky; top:calc(10px + env(safe-area-inset-top)); z-index:30;
  display:grid; grid-template-columns:repeat(7,1fr); gap:3px; padding:6px; border-radius:26px;
}
.day-btn{
  border:0; background:transparent; color:var(--ink2); cursor:pointer; position:relative;
  padding:11px 0 12px; border-radius:20px; font-weight:700; font-size:14px;
  transition:background .25s, color .25s, box-shadow .25s;
}
.day-btn[aria-selected="true"]{
  background:var(--sel); color:var(--ink);
  box-shadow:inset 0 1px 0 var(--hi), 0 4px 14px var(--shadow);
}
.day-btn.today::after{
  content:""; position:absolute; left:50%; bottom:5px; width:5px; height:5px; margin-left:-2.5px;
  border-radius:50%; background:var(--accent);
}

/* ---------- Intestazione del giorno ---------- */
.dayhead{padding:22px 6px 4px}
.dayhead .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h2{margin:0;font-size:30px;font-weight:800;letter-spacing:-.02em}
.today-pill{
  font-size:13px;font-weight:800;padding:4px 11px;border-radius:999px;
  background:var(--accent);color:var(--accent-ink);
}
.progress{margin-top:12px}
.ptxt{font-size:14px;color:var(--ink2);display:flex;justify-content:space-between;gap:8px}
.bar{margin-top:7px;height:8px;border-radius:99px;background:var(--divider);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 60%,#7FE3FF));transition:width .4s ease}
.hint{margin:10px 0 0;font-size:13.5px;color:var(--ink2)}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.pill{
  border:0;cursor:pointer;padding:9px 16px;border-radius:999px;font-weight:700;font-size:14px;
  background:linear-gradient(140deg,var(--glass-a),var(--glass-b));
  box-shadow:inset 0 1px 0 var(--hi), inset 0 0 0 1px var(--edge), 0 4px 12px var(--shadow);
}

/* ---------- Pasti ---------- */
.meals{margin-top:6px}
.meal{margin-top:12px}
.meal-h{display:flex;align-items:center;gap:4px;padding:6px 10px 6px 6px}
.meal-toggle{
  flex:1;min-width:0;display:flex;align-items:center;gap:12px;background:none;border:0;
  text-align:left;padding:8px;border-radius:22px;cursor:pointer;
}
.chip{
  flex:none;width:46px;height:46px;border-radius:16px;display:grid;place-items:center;font-size:23px;
  background:color-mix(in srgb,var(--c) 26%,transparent);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55), inset 0 0 0 1px color-mix(in srgb,var(--c) 40%,transparent);
}
.mtxt{flex:1;min-width:0;display:flex;flex-direction:column}
.mname{font-weight:800;font-size:18px;letter-spacing:-.01em}
.msub{font-size:13.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meal.open .pv{display:none}
.meal:not(.open) .cn{display:none}
.chev{flex:none;color:var(--ink2);transition:transform .3s ease}
.meal.open .chev,.acc.open .chev{transform:rotate(180deg)}
.done-btn{
  flex:none;width:40px;height:40px;border-radius:50%;cursor:pointer;display:grid;place-items:center;
  background:transparent;border:2px solid color-mix(in srgb,var(--ink2) 55%,transparent);color:transparent;
  transition:background .25s,border-color .25s,color .25s,transform .2s;
}
.done-btn:active{transform:scale(.92)}
.meal.done .done-btn{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.meal.done .mname{opacity:.65}

.meal-body,.tip,.acc-b{
  display:grid;grid-template-rows:0fr;visibility:hidden;
  transition:grid-template-rows .32s ease,visibility 0s .32s;
}
.meal.open>.meal-body,.tip.open,.acc.open>.acc-b{grid-template-rows:1fr;visibility:visible;transition-delay:0s}
.meal-in,.tip-in,.acc-in{overflow:hidden;min-height:0}
.foods{list-style:none;margin:0;padding:0 18px 8px}
.food{padding:13px 0;border-top:1px solid var(--divider)}
.food-main{display:flex;align-items:center;gap:10px}
.fname{flex:1;min-width:0;font-weight:700;font-size:16.5px}
.qty{
  flex:none;white-space:nowrap;font-weight:800;font-size:14.5px;padding:6px 13px;border-radius:999px;
  font-variant-numeric:tabular-nums;
  background:color-mix(in srgb,var(--c) 20%,transparent);
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 34%,transparent);
}
.qty.qb{font-weight:600;background:transparent;color:var(--ink2)}
.info{
  flex:none;width:30px;height:30px;border-radius:50%;cursor:pointer;border:0;
  font-family:Georgia,serif;font-style:italic;font-weight:700;font-size:16px;color:var(--ink2);
  background:linear-gradient(140deg,var(--glass-a),var(--glass-b));
  box-shadow:inset 0 1px 0 var(--hi), inset 0 0 0 1px var(--edge);
  transition:background .25s,color .25s;
}
.info[aria-expanded="true"]{background:var(--accent);color:var(--accent-ink)}
.parts{list-style:none;margin:10px 0 0;padding:0}
.parts li{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:6px 0 6px 12px;margin-left:4px;color:var(--ink2);font-size:15px;
  border-left:3px solid color-mix(in srgb,var(--c) 55%,transparent);
}
.parts li+li{margin-top:4px}
.tipbox{
  margin-top:12px;padding:13px 15px;border-radius:18px;font-size:14.5px;line-height:1.55;color:var(--ink);
  background:color-mix(in srgb,var(--c,var(--accent)) 11%,transparent);
  border:1px solid color-mix(in srgb,var(--c,var(--accent)) 24%,transparent);
}
.link{
  display:block;margin-top:10px;padding:0;border:0;background:none;cursor:pointer;
  color:var(--accent);font-weight:800;font-size:14.5px;text-decoration:underline;text-underline-offset:3px;
}
.footer-actions{margin-top:18px;text-align:center}
.textbtn{border:0;background:none;color:var(--ink2);font-size:14px;font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:8px}

/* ---------- Giorno libero ---------- */
.free{margin-top:14px;padding:22px 20px 20px}
.free .chip{margin-bottom:12px;--c:#34C77B}
.free h3{margin:0 0 8px;font-size:22px;font-weight:800;letter-spacing:-.01em}
.free p{margin:0 0 10px;color:var(--ink2);font-size:16px;line-height:1.55}
.free .lbl{margin-top:16px;font-weight:700;color:var(--ink);font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}

/* ---------- Consigli ---------- */
.section-title{margin:26px 6px 4px;font-size:22px;font-weight:800;letter-spacing:-.01em}
.section-note{margin:0 6px 6px;color:var(--ink2);font-size:14.5px}
.acc{margin-top:10px;border-radius:24px}
.acc-h{
  width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;
  background:none;border:0;padding:16px 18px;cursor:pointer;border-radius:24px;
}
.at{display:flex;flex-direction:column;min-width:0}
.at b{font-weight:800;font-size:16.5px}
.at small{color:var(--ink2);font-size:13.5px;margin-top:2px}
.acc-pad{padding:0 18px 18px}
.acc-pad p{margin:0 0 8px;font-size:15px;line-height:1.55}
.acc-pad ul.rules{margin:0;padding-left:20px;font-size:15px;line-height:1.55}
.acc-pad ul.rules li+li{margin-top:6px}
ul.alts{list-style:none;margin:0;padding:0}
ul.alts li{padding:11px 0;border-top:1px solid var(--divider)}
ul.alts li:first-child{border-top:0;padding-top:2px}
.an{display:block;font-weight:800;font-size:15.5px}
.ai{display:block;color:var(--ink2);font-size:14.5px;margin-top:2px;line-height:1.5}
.tag{
  display:inline-block;margin-left:8px;padding:2px 9px;border-radius:99px;vertical-align:1px;
  font-size:12px;font-weight:800;background:var(--accent);color:var(--accent-ink);
}
.search{
  width:100%;margin-top:12px;padding:15px 20px;border-radius:999px;border:1px solid var(--edge);
  font:inherit;font-size:16px;color:var(--ink);
  background:linear-gradient(140deg,var(--glass-a),var(--glass-b));
  -webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);
  box-shadow:inset 0 1px 0 var(--hi), 0 6px 18px var(--shadow);
}
.search::placeholder{color:var(--ink2)}
.nores{margin:16px 6px;color:var(--ink2)}

/* ---------- Barra in basso ---------- */
.nav{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));
  z-index:40;display:flex;gap:4px;padding:6px;border-radius:999px;
}
.nav button{
  display:flex;align-items:center;gap:8px;padding:11px 22px;border-radius:999px;border:0;
  background:transparent;color:var(--ink2);font-weight:800;font-size:15px;cursor:pointer;
  transition:background .25s,color .25s,box-shadow .25s;
}
.nav button[aria-selected="true"]{background:var(--sel);color:var(--ink);box-shadow:inset 0 1px 0 var(--hi), 0 4px 14px var(--shadow)}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
@media (max-width:380px){
  .day-btn{font-size:13px}
  .qty{font-size:13.5px;padding:5px 10px}
  .nav button{padding:11px 18px}
}
</style>
</head>
<body>
<div class="blob b1" aria-hidden="true"></div>
<div class="blob b2" aria-hidden="true"></div>
<div class="blob b3" aria-hidden="true"></div>
<div class="blob b4" aria-hidden="true"></div>

<div class="wrap">
  <header class="top">
    <h1>Il mio menu</h1>
    <p class="sub">Piano alimentare dell'11 settembre 2026</p>
  </header>

  <main>
    <section id="menu" aria-label="Menu della settimana">
      <div class="days glass" role="tablist" aria-label="Giorni della settimana" id="days"></div>
      <div id="day"></div>
    </section>

    <section id="consigli" aria-label="Consigli" hidden>
      <h2 class="section-title" style="margin-top:8px">Regole di base</h2>
      <div id="rules"></div>

      <h2 class="section-title">Alternative ai piatti</h2>
      <p class="section-note">Il primo piatto di ogni elenco è quello del tuo menu e va scelto più spesso. Gli altri servono per variare.</p>
      <div id="alts"></div>

      <h2 class="section-title">Guida agli alimenti</h2>
      <p class="section-note">Pesi, misure e modi di cottura di ogni alimento.</p>
      <input class="search" id="q" type="search" placeholder="Cerca un alimento" aria-label="Cerca un alimento" autocomplete="off">
      <div id="guida"></div>
      <p class="nores" id="nores" hidden>Nessun alimento trovato.</p>
    </section>
  </main>
</div>

<nav class="nav glass" role="tablist" aria-label="Sezioni">
  <button role="tab" id="tab-menu" data-a="tab" data-tab="menu" aria-selected="true">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>
    Menu
  </button>
  <button role="tab" id="tab-consigli" data-a="tab" data-tab="consigli" aria-selected="false">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>
    Consigli
  </button>
</nav>

<script>
(function(){

    {id:'mer', short:'Mer', name:'Mercoledì', meals:{
      colazione:[F('Latte intero di vacca delattosato','1 bicchiere','latte'),F('Fiocchi di mais aglutinati','1 bicchiere e ½','fiocchi'),F('Fette biscottate aglutinate','n° 2','fette'),F('Marmellata','2 cucchiaini','marmellata')],

      pranzo:[D('Pasta aglutinata con il tonno al naturale',[P('Pasta aglutinata','g 130'),P('Tonno al naturale','g 40')],'tonno','1230')],
      merenda:[F('Pane aglutinato','g 100','pane'),F('Crema di mandorle','4 cucchiaini','mandorlecrema'),F('Banane','n° 1','banane')],
      cena:[F('Petto di pollo','g 200','pollo'),F('Valeriana','1 porzione','valeriana')],
      arco:[F('Pane aglutinato','g 150','pane'),F('Olio extra vergine di oliva','7 cucchiaini','olio')]
    }},
    {id:'gio', short:'Gio', name:'Giovedì', meals:{
      colazione:[F('Latte intero di vacca','1 bicchiere','latte'),F('Fiocchi di mais','1 bicchiere','fiocchi'),F('Fette biscottate aglutinate','n° 2','fette'),F('Burro di arachidi a ridotto contenuto di grassi','g 10','arachidi')],

    var qty = f.q ? '<span class="qty">'+esc(f.q)+'</span>' : '';
    var parts = f.parts ? '<ul class="parts">'+f.parts.map(function(p){
      return '<li><span>'+esc(p.n)+'</span><span class="qty'+(p.q===QB?' qb':'')+'">'+esc(p.q)+'</span></li>';
    }).join('')+'</ul>' : '';
    var alt = f.alt ? '<button class="link" data-a="alt" data-alt="'+f.alt+'">Vedi le alternative a questo piatto</button>' : '';
    var tip = t ? '<div class="tip"><div class="tip-in"><div class="tipbox">'+esc(t.text)+alt+'</div></div></div>' : '';
    return '<li class="food"><div class="food-main"><span class="fname">'+esc(f.n)+'</span>'+qty+info+'</div>'+parts+tip+'</li>';
  }

  function mealHTML(m, items, dayId){
    var key = dayId+':'+m.id;
    var done = !!state.done[key];
    var preview = items.map(function(i){ return i.n; }).join(', ');
    var count = items.length + (items.length===1 ? ' alimento' : ' alimenti');
    return '<section class="meal glass open'+(done?' done':'')+'" style="--c:'+m.c+'" data-key="'+key+'">'+
      '<div class="meal-h">'+
        '<button class="meal-toggle" data-a="meal" aria-expanded="true">'+
          '<span class="chip" aria-hidden="true">'+m.icon+'</span>'+
          '<span class="mtxt"><span class="mname">'+esc(m.name)+'</span><span class="msub"><span class="cn">'+count+'</span><span class="pv">'+esc(preview)+'</span></span></span>'+
          CHEV+
        '</button>'+
        '<button class="done-btn" data-a="done" aria-pressed="'+done+'" aria-label="Segna come fatto: '+esc(m.name)+'">'+CHECK+'</button>'+
      '</div>'+
      '<div class="meal-body"><div class="meal-in"><ul class="foods">'+items.map(foodHTML).join('')+'</ul></div></div>'+
    '</section>';
  }

  function renderDays(){
    qs('#days').innerHTML = DAYS.map(function(d,i){
      return '<button class="day-btn'+(i===state.today?' today':'')+'" role="tab" data-a="day" data-i="'+i+'" aria-selected="'+(i===state.day)+'" aria-label="'+d.name+(i===state.today?' (oggi)':'')+'">'+d.short+'</button>';
    }).join('');
  }

  function renderDay(){
    var d = DAYS[state.day];
    var head = '<div class="dayhead"><div class="row"><h2>'+d.name+'</h2>'+(state.day===state.today?'<span class="today-pill">Oggi</span>':'')+'</div>';
    var html;
    if(d.free){
      html = head+'</div>'+
        '<section class="free glass"><div class="chip" aria-hidden="true">🌿</div>'+
        '<h3>Giorno a dieta libera</h3>'+
        '<p>Oggi scegli tu gli alimenti e le quantità di ogni pasto, prendendo come esempio gli altri giorni della settimana.</p>'+
        '<p>È un esercizio utile: anticipa quello che farai da solo quando la dieta sarà finita.</p>'+
        '<div class="lbl">Prendi spunto da un giorno</div>'+
        '<div class="chips">'+DAYS.filter(function(x){return !x.free;}).map(function(x){
          return '<button class="pill" data-a="day" data-i="'+DAYS.indexOf(x)+'">'+x.name+'</button>';
        }).join('')+'</div></section>';
    } else {
      html = head+
        '<div class="progress"><div class="ptxt"><span><b id="pc">0</b> di '+MEALS.length+' completati</span></div><div class="bar"><i id="pf"></i></div></div>'+
        '<p class="hint">Tocca il cerchio a destra di un pasto per segnarlo come fatto.</p>'+
        '<div class="actions"><button class="pill" id="allbtn" data-a="all">Comprimi tutto</button></div></div>'+
        '<div class="meals">'+MEALS.map(function(m){ return mealHTML(m, d.meals[m.id], d.id); }).join('')+'</div>'+
        '<div class="footer-actions" id="resetwrap"><button class="textbtn" data-a="reset">Azzera le spunte della settimana</button></div>';
    }
    qs('#day').innerHTML = html;
    updateProgress();
  }

  function updateProgress(){
    var d = DAYS[state.day]; if(d.free) return;
    var n = MEALS.filter(function(m){ return state.done[d.id+':'+m.id]; }).length;
    var pc = qs('#pc'), pf = qs('#pf');
    if(pc) pc.textContent = n;
    if(pf) pf.style.width = Math.round(n/MEALS.length*100)+'%';
    var rw = qs('#resetwrap');
    if(rw) rw.hidden = Object.keys(state.done).filter(function(k){return state.done[k];}).length === 0;
  }

  /* ---------- Consigli ---------- */
  function acc(id, title, sub, body, name){
    return '<div class="acc glass" id="'+id+'"'+(name?' data-name="'+esc(name.toLowerCase())+'"':'')+'>'+
      '<button class="acc-h" data-a="acc" aria-expanded="false"><span class="at"><b>'+esc(title)+'</b>'+(sub?'<small>'+esc(sub)+'</small>':'')+'</span>'+CHEV+'</button>'+
      '<div class="acc-b"><div class="acc-in"><div class="acc-pad">'+body+'</div></div></div></div>';
  }

  function renderConsigli(){
    qs('#rules').innerHTML = RULES.map(function(r,i){
      return acc('rule-'+i, r.t, '', '<ul class="rules">'+r.items.map(function(x){ return '<li>'+esc(x)+'</li>'; }).join('')+'</ul>');
    }).join('');

    qs('#alts').innerHTML = ['1239','445','1230','632','794'].map(function(k){
      var a = ALTS[k];
      var body = '<ul class="alts">'+a.list.map(function(x,i){
        return '<li><span class="an">'+esc(x[0])+(i===0?'<span class="tag">Nel tuo menu</span>':'')+'</span><span class="ai">'+esc(x[1])+'</span></li>';
      }).join('')+'</ul>';
      return acc('alt-'+k, 'Alternative: '+a.title, a.sub, body);
    }).join('');

    var keys = Object.keys(TIPS).sort(function(a,b){ return TIPS[a].name.localeCompare(TIPS[b].name,'it'); });
    qs('#guida').innerHTML = keys.map(function(k){
      return acc('g-'+k, TIPS[k].name, '', '<p>'+esc(TIPS[k].text)+'</p>', TIPS[k].name);
    }).join('');
  }

  /* ---------- Navigazione ---------- */
  function setTab(t){
    qs('#menu').hidden = t !== 'menu';
    qs('#consigli').hidden = t !== 'consigli';
    qsa('.nav button').forEach(function(b){ b.setAttribute('aria-selected', String(b.dataset.tab === t)); });
    window.scrollTo({top:0});
  }

  function toggleAcc(a, force){
    var open = force !== undefined ? force : !a.classList.contains('open');
    a.classList.toggle('open', open);
    var h = qs('.acc-h', a); if(h) h.setAttribute('aria-expanded', String(open));
  }

  document.addEventListener('click', function(e){
    var el = e.target.closest('[data-a]'); if(!el) return;
    var a = el.dataset.a;

    if(a === 'tab'){ setTab(el.dataset.tab); }

    else if(a === 'day'){
      state.day = +el.dataset.i; renderDays(); renderDay();
      if(el.closest('.free')) window.scrollTo({top:0,behavior:'smooth'});
    }

    else if(a === 'meal'){
      var m = el.closest('.meal');
      var open = !m.classList.contains('open');
      m.classList.toggle('open', open);
      el.setAttribute('aria-expanded', String(open));
    }

    else if(a === 'done'){
      var mm = el.closest('.meal'), k = mm.dataset.key;
      state.done[k] = !state.done[k];
      mm.classList.toggle('done', !!state.done[k]);
      el.setAttribute('aria-pressed', String(!!state.done[k]));
      save(); updateProgress();
    }

    else if(a === 'tip'){
      var tip = el.closest('.food').querySelector('.tip');
      var o = !tip.classList.contains('open');
      tip.classList.toggle('open', o);
      el.setAttribute('aria-expanded', String(o));
    }

    else if(a === 'all'){
      var meals = qsa('.meal');
      var anyOpen = meals.some(function(x){ return x.classList.contains('open'); });
      meals.forEach(function(x){
        x.classList.toggle('open', !anyOpen);
        qs('.meal-toggle', x).setAttribute('aria-expanded', String(!anyOpen));
      });
      el.textContent = anyOpen ? 'Espandi tutto' : 'Comprimi tutto';
    }

    else if(a === 'acc'){ toggleAcc(el.closest('.acc')); }

    else if(a === 'alt'){
      setTab('consigli');
      var target = document.getElementById('alt-'+el.dataset.alt);
      toggleAcc(target, true);
      setTimeout(function(){ target.scrollIntoView({behavior:'smooth', block:'center'}); }, 80);
    }

    else if(a === 'reset'){
      state.done = {}; save();
      qsa('.meal').forEach(function(x){
        x.classList.remove('done');
        qs('.done-btn', x).setAttribute('aria-pressed','false');
      });
      updateProgress();
    }
  });

  qs('#q').addEventListener('input', function(e){
    var v = e.target.value.trim().toLowerCase(), n = 0;
    qsa('#guida .acc').forEach(function(x){
      var ok = !v || x.dataset.name.indexOf(v) !== -1;
      x.hidden = !ok; if(ok) n++;
    });
    qs('#nores').hidden = n > 0;
  });

  renderDays(); renderDay(); renderConsigli();
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
